name: Matcher safety tests

on:
  push:
    branches:
      - "fix/**"
  pull_request:
    paths:
      - "matcher.py"
      - "tests/test_matcher.py"
      - ".github/workflows/matcher-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matcher:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run ancillary-feed regression tests
        run: >-
          python -m pytest -q --import-mode=importlib tests/test_matcher.py
          -k "TwoTeamAncillarySafety or press_conference_is_not_live_game or ended_slot_is_not_live_game"
